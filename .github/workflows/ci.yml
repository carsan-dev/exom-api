name: API CI

on:
  push:
    branches: [main, 'feat/**', 'feature/**', 'fix/**', 'phase9/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: API quality and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-bookworm@sha256:66aafa11cf15800a3c94763f7e11d1e7b2e37e5e84bc4ce027cb6e1e4bfaf4df
        env:
          POSTGRES_USER: exom_ci
          POSTGRES_PASSWORD: exom_ci_disposable
          POSTGRES_DB: exom_ci
          PGDATA: /var/lib/postgresql/exom-ci-data
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U exom_ci -d exom_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://exom_ci:exom_ci_disposable@127.0.0.1:5432/exom_ci
      DATABASE_URL: postgresql://exom_ci:exom_ci_disposable@127.0.0.1:5432/exom_ci
      PRISMA_DATABASE_URL: postgresql://exom_ci:exom_ci_disposable@127.0.0.1:5432/exom_ci
      DATABASE_SSL_MODE: disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm exec -- prisma validate
      - run: npm run prisma:format:check
      - run: npm run lint -- --no-fix
      - run: npm run build
      - name: Detect HTTP contract drift
        run: npm run contract:check
      - name: Verify disposable database before migrations
        run: node scripts/test-database.cjs
      - run: npm exec -- prisma migrate deploy
      - name: Test database identity and launcher safety gates
        run: node --test scripts/test-database.test.cjs scripts/run-adherence-integration.test.cjs
      - name: Run all src suites and full concurrency with legacy84 and tracking OFF
        run: npm run test:adherence:off
      - name: Run all five external PostgreSQL suites and resolver with owned tracking ON
        run: npm run test:adherence:on
      - name: Run isolated HTTP integration suite
        run: npm run test:e2e
        env:
          HOST: 127.0.0.1
          EXOM_SMOKE_DISABLE_SCHEDULERS: '1'
      - name: Build the reviewed Docker source
        run: docker build --tag exom-api:${{ github.sha }} .
      - name: Smoke test the runner
        run: node scripts/smoke-docker.cjs exom-api:${{ github.sha }}
