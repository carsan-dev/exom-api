name: Supabase database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}

    steps:
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --data-only --use-copy

      - name: Compress and encrypt backup
        shell: bash
        run: |
          set -euo pipefail
          archive="supabase-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          tar -czf "$archive" -C backup roles.sql schema.sql data.sql
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 \
            -in "$archive" \
            -out "${archive}.enc" \
            -pass env:BACKUP_PASSWORD
          rm -rf backup "$archive"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: supabase-backup-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz.enc
          if-no-files-found: error
          retention-days: 30

